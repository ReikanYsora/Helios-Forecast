name: tests

on:
  push:
    branches:
      - main
      - 'develop-**'
      - '[0-9]*'
  pull_request:

permissions:
  contents: read

jobs:
  pure:
    name: pure suite
    # The computation modules import nothing from Home Assistant, so this group runs under a
    # bare pytest and answers in under a second. Everything coupled to Home Assistant is the
    # job below; both are required, one without the other proves nothing about a release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: pip install pytest==9.1.1
      - run: pytest -q tests --ignore=tests/ha

  home-assistant:
    name: Home Assistant suite
    # The recorder, the config entry, the entities and the archive migration. The harness is
    # pinned so one of its releases cannot turn a green branch red on its own.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: pip install pytest-homeassistant-custom-component==0.13.316
      - run: pytest -o asyncio_mode=auto -q tests/ha
